name: Redirect native Swift contracts
on:
  pull_request:
    paths:
      - 'sdk/redirects/swift/**'
      - 'scripts/test-redirect-swift.mjs'
      - '.github/workflows/redirect-native-swift.yml'
  push:
    branches: [main]
    paths:
      - 'sdk/redirects/swift/**'
      - 'scripts/test-redirect-swift.mjs'
      - '.github/workflows/redirect-native-swift.yml'
permissions:
  contents: read
concurrency:
  group: redirect-swift-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: macos-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.20.0'
      - name: Initialize native CodeQL
        uses: github/codeql-action/init@v4.38.2
        with:
          languages: swift
          build-mode: manual
      - name: Compile Swift package and run native URLSession contracts
        run: node scripts/test-redirect-swift.mjs
      - name: Analyze native client
        uses: github/codeql-action/analyze@v4.38.2
        with:
          category: /language:swift/native-redirects
